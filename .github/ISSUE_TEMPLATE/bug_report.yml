name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: Commands you ran, what you expected, what you saw. Add `--debug` output if you can.
    validations:
      required: true
  - type: input
    attributes:
      label: rtun version
      placeholder: output of `rtun version`
    validations:
      required: true
  - type: input
    attributes:
      label: OS / platform (client and server)
